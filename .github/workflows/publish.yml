name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.version_bump }} release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aws-intel/

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

      - name: Increment version
        run: poetry version "${{ inputs.version_bump }}"

      - name: Build distributions
        run: poetry build

      - name: Push version increment
        run: |
          version="$(poetry version --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release ${version}"
          git push origin HEAD:main

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag published version
        run: |
          version="$(poetry version --short)"
          git tag --annotate "v${version}" --message "Release ${version}"
          git push origin "v${version}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(poetry version --short)"
          gh release create "v${version}" \
            --verify-tag \
            --title "Release ${version}" \
            --generate-notes
